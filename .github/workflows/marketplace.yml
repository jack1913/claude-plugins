name: marketplace

on:
  push:
    branches:
      - main
    paths:
      - ".claude-plugin/**"
      - ".github/rulesets/**"
      - ".github/scripts/check-marketplace.py"
      - ".github/scripts/check-workflows.py"
      - ".github/workflows/**"
      - ".github/workflows/marketplace.yml"
  pull_request:
    paths:
      - ".claude-plugin/**"
      - ".github/rulesets/**"
      - ".github/scripts/check-marketplace.py"
      - ".github/scripts/check-workflows.py"
      - ".github/workflows/**"
      - ".github/workflows/marketplace.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # named after the workflow, as every workflow's verdict is (.github/scripts/check-workflows.py)
  marketplace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Every marketplace entry has its plugin folder, and every folder is listed
        run: python3 .github/scripts/check-marketplace.py
      - name: Every workflow runs on main and pull requests, never on tags, with a pinned runner, a read-only token and one verdict job; every plugin has its release-tag ruleset
        run: python3 .github/scripts/check-workflows.py
      - name: The workflow and ruleset check catches each rule broken on purpose
        run: python3 .github/scripts/check-workflows.py --self-test
