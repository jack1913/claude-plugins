# Continuous integration for the brand-creator plugin, in the monorepo jack1913/claude-plugins (GitHub reads only the root .github/).
# Every job that checks out the repository runs in plugins/brand-creator (the verdict needs no checkout); the workflow starts only on changes under that folder or to this file, so the macOS jobs
# (the expensive ones) run only when this plugin changes.
#
#   linux-suite  three parallel jobs, one per part of the suite (pytest, node, smoke), each building tests/docker/Dockerfile
#             (Debian 13, Python 3.13, Node 24, resvg, ImageMagick, Ghostscript, poppler, ripgrep, potrace, fonts) and running
#             tests/docker/run.sh with BRAND_CREATOR_TEST_PARTS: `brand-creator setup` (npm ci + Chromium), then that part, on the paths
#             that apply off macOS, within a deadline inside the container (BRAND_CREATOR_SUITE_MINUTES) that ends before the job's.
#             The macOS-only tests are NOT VERIFIED there by design; tests/docker/verify_log.py accepts exactly those and fails on any
#             other skip, and on a part that left no summary. The run log and pytest's JUnit file are kept as an artifact.
#   validate  `claude plugin validate --strict` through the Claude Code CLI installed from npm. On the pinned CLI (2.1.302) it checks the
#             plugin manifest only: a skill with broken YAML frontmatter or an unknown key in hooks.json still passes it.
#             The skill and agent frontmatter and hooks.json are checked by the repository's own tests (tests/test_skills.py,
#             tests/test_agents_workflows.py, tests/test_guard.py), which run in the linux-suite pytest job. This job also runs the test that mutates
#             plugin.json and expects the validator to catch it. If the CLI cannot be installed or started, the job fails: an
#             unvalidated manifest never passes the verdict.
#   macos-suite  three parallel jobs on macOS: the Apple-tool tests (requires_macos, requires_actool: sips, iconutil, actool,
#             assetutil, the .icon pipeline) with BRAND_CREATOR_REQUIRE_ALL=1 so a missing tool fails instead of skipping, and the
#             two halves of the Acme smoke with `emit apple` (ACME_SMOKE_PART: the shared build, then tools/finish.sh or every
#             other section).
#   brand-creator  the workflow's verdict: passes only when every other job passed (a failed, cancelled or skipped job is never green).
#             A release tag brand-creator--v* is accepted only on a commit where this check and docs passed
#             (.github/rulesets/brand-creator-release-tags.json, docs/adr/ADR-0005-release-tags-need-a-passing-ci-verdict.md).
#
# `claude plugin eval` is never run here (it is billed); the evals are run by hand, see docs/internals/manual-checks.md.
name: brand-creator

on:
  push:
    branches:
      - main
    paths:
      - "plugins/brand-creator/**"
      - ".github/workflows/brand-creator.yml"
  pull_request:
    paths:
      - "plugins/brand-creator/**"
      - ".github/workflows/brand-creator.yml"
  workflow_dispatch:

permissions:
  contents: read

# A superseded pull-request run is cancelled; a run on main never is, because it is the commit's only verdict.
concurrency:
  group: brand-creator-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: plugins/brand-creator

env:
  # The Claude Code version the plugin was validated with; the stated minimum is MIN_CLAUDE in scripts/prereq.py.
  CLAUDE_CODE_VERSION: "2.1.302"

jobs:
  linux-suite:
    name: "linux (${{ matrix.part }})"
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.job-minutes }}
    strategy:
      fail-fast: false
      matrix:
        # suite-minutes: the deadline inside the container; job-minutes leaves room for the image, setup and the log check
        include:
          - part: pytest
            suite-minutes: 45
            job-minutes: 60
          - part: node
            suite-minutes: 15
            job-minutes: 30
          - part: smoke
            suite-minutes: 30
            job-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Build the Linux image and run one part of the suite inside it
        run: tests/docker/run.sh
        env:
          BRAND_CREATOR_TEST_WORKERS: "4"
          BRAND_CREATOR_TEST_PARTS: ${{ matrix.part }}
          BRAND_CREATOR_SUITE_MINUTES: ${{ matrix.suite-minutes }}
          BRAND_CREATOR_TEST_OUT: ${{ runner.temp }}/bc-out
      - name: Keep the run log and the JUnit file
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.part }}-reports
          path: ${{ runner.temp }}/bc-out
          retention-days: 14

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      # the uv of tests/docker/Dockerfile (UV_VERSION)
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.11"
      # a CLI that cannot be installed fails the job: an unvalidated manifest must not pass the verdict
      - name: Install the Claude Code CLI
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version
      - name: claude plugin validate --strict
        run: claude plugin validate "$GITHUB_WORKSPACE/plugins/brand-creator" --strict
      - name: The validator catches a broken manifest (mutation test)
        run: uv run --no-project --with-requirements tests/requirements.txt python -m pytest tests/test_static.py -q -k claude_plugin_validate
        env:
          BRAND_CREATOR_REQUIRE_ALL: "1"

  macos-suite:
    name: "macos (${{ matrix.part }})"
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # smoke: the half of tests/smoke/acme.sh that part runs (ACME_SMOKE_PART); the halves share the build up to the frozen round
        include:
          - part: pytest
          - part: smoke-finish
            smoke: finish
          - part: smoke-rest
            smoke: rest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      # the uv of tests/docker/Dockerfile (UV_VERSION)
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.11"
      - name: Install the tools the plugin documents
        run: brew install resvg imagemagick ghostscript poppler ripgrep potrace
      - name: Select the newest Xcode (the Icon Composer .icon pipeline needs Xcode 26 or later)
        run: |
          # shellcheck disable=SC2012
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          echo "using $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version
          xcrun --find actool
      - name: brand-creator setup (npm ci, Chromium)
        run: bin/brand-creator --data "$RUNNER_TEMP/bc-data" setup --yes
      - name: Apple-tool tests (a missing Apple tool is a failure here, not a skip)
        if: matrix.part == 'pytest'
        run: uv run --no-project --with-requirements tests/requirements.txt python -m pytest tests -q -n 3 --dist worksteal -m "requires_macos or requires_actool"
        env:
          BRAND_CREATOR_DATA: ${{ runner.temp }}/bc-data
          BRAND_CREATOR_REQUIRE_ALL: "1"
      - name: "Acme smoke, one half (the macOS path: emit apple, actool per platform, sips)"
        if: matrix.part != 'pytest'
        run: |
          set -o pipefail
          tests/smoke/acme.sh | tee "$RUNNER_TEMP/smoke.log"
          # the only thing that may be NOT VERIFIED is the eval loader check (the claude CLI is not installed in this job)
          if grep 'NOT VERIFIED' "$RUNNER_TEMP/smoke.log" | grep -v 'the claude CLI is not on PATH'; then echo "unexpected NOT VERIFIED in the smoke" >&2; exit 1; fi
        env:
          BRAND_CREATOR_DATA: ${{ runner.temp }}/bc-data
          ACME_SMOKE_DIR: ${{ runner.temp }}/acme-smoke
          ACME_SMOKE_PART: ${{ matrix.smoke }}

  # The verdict: the one check a release tag needs. It runs even when a job failed or was cancelled (a skipped job would
  # count as passed in a required check) and passes only when every job it needs passed.
  brand-creator:
    needs:
      - linux-suite
      - validate
      - macos-suite
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
