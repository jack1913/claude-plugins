# Continuous integration for the brand-creator plugin, in the monorepo jack1913/claude-plugins (GitHub reads only the root .github/).
# Every job that checks out the repository runs in plugins/brand-creator (the verdict needs no checkout); the workflow starts only on changes under that folder or to this file.
#
# CI is kept to quick checks, a few minutes per run (docs/adr/ADR-0008-ci-runs-quick-checks-the-full-suite-runs-before-a-release.md).
# The full suite (pytest, node and the smoke, on the Mac and in the Linux Docker image) runs on the maintainer's machine before
# each release tag and is recorded in docs/internals/manual-checks.md ("Release run").
#
#   validate  `claude plugin validate --strict` through the Claude Code CLI installed from npm, then the quick tests: the
#             manifest and version pins (tests/test_static.py, its validator mutation test included), the skill and agent
#             frontmatter (tests/test_skills.py, tests/test_agents_workflows.py), the hooks (tests/test_guard.py), the eval cases
#             (tests/test_evals.py), this workflow's shape (tests/test_docker_ci.py) and the paid-test guard (tests/test_paid_guard.py).
#             BRAND_CREATOR_REQUIRE_ALL=1 turns any skip into a failure; the two tests that need a set-up data directory or the
#             private denylist are deselected by name. If the CLI cannot be installed or started, the job fails: an unvalidated
#             manifest never passes the verdict.
#   brand-creator  the workflow's verdict: passes only when every other job passed (a failed, cancelled or skipped job is never green).
#             A release tag brand-creator--v* is accepted only on a commit where this check and docs passed
#             (.github/rulesets/brand-creator-release-tags.json, docs/adr/ADR-0005-release-tags-need-a-passing-ci-verdict.md).
#
# `claude plugin eval` is never run here (it is billed); the evals are run by hand, see docs/internals/manual-checks.md.
# No job runs on macOS or builds the Docker image.
name: brand-creator

on:
  push:
    branches:
      - main
    paths:
      - "plugins/brand-creator/**"
      - ".github/workflows/brand-creator.yml"
  pull_request:
    paths:
      - "plugins/brand-creator/**"
      - ".github/workflows/brand-creator.yml"
  workflow_dispatch:

permissions:
  contents: read

# A superseded pull-request run is cancelled; a run on main never is, because it is the commit's only verdict.
concurrency:
  group: brand-creator-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: plugins/brand-creator

env:
  # The Claude Code version the plugin was validated with; the stated minimum is MIN_CLAUDE in scripts/prereq.py.
  CLAUDE_CODE_VERSION: "2.1.302"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      # the uv of tests/docker/Dockerfile (UV_VERSION)
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.11"
      # a CLI that cannot be installed fails the job: an unvalidated manifest must not pass the verdict
      - name: Install the Claude Code CLI
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version
      - name: claude plugin validate --strict
        run: claude plugin validate "$GITHUB_WORKSPACE/plugins/brand-creator" --strict
      - name: Quick tests (any skip fails)
        run: |
          uv run --no-project --with-requirements tests/requirements.txt python -m pytest -q -p no:cacheprovider \
            tests/test_static.py tests/test_skills.py tests/test_agents_workflows.py tests/test_guard.py \
            tests/test_evals.py tests/test_docker_ci.py tests/test_paid_guard.py \
            --deselect tests/test_static.py::test_anonymisation \
            --deselect tests/test_evals.py::test_the_kit_in_the_kit_fixture_is_current_for_the_project_it_sits_in
        env:
          BRAND_CREATOR_REQUIRE_ALL: "1"

  # The verdict: the one check a release tag needs. It runs even when a job failed or was cancelled (a skipped job would
  # count as passed in a required check) and passes only when every job it needs passed.
  brand-creator:
    needs:
      - validate
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
