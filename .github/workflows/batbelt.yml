name: batbelt
on:
  push:
    branches:
      - main
    paths:
      - "plugins/batbelt/**"
      - "tests/**"
      - ".claude-plugin/**"
      - ".github/workflows/batbelt.yml"
  pull_request:
    paths:
      - "plugins/batbelt/**"
      - "tests/**"
      - ".claude-plugin/**"
      - ".github/workflows/batbelt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # the uv that plugins/brand-creator/tests/docker/Dockerfile pins (UV_VERSION)
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.11"
      - name: Tests
        run: uv run --no-project --with-requirements tests/requirements.txt python -m pytest tests -q
