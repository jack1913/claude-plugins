name: batbelt
on:
  push:
    paths:
      - "plugins/batbelt/**"
      - "tests/**"
      - ".claude-plugin/**"
      - ".github/workflows/batbelt.yml"
  pull_request:
    paths:
      - "plugins/batbelt/**"
      - "tests/**"
      - ".claude-plugin/**"
      - ".github/workflows/batbelt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Tests
        run: uv run --no-project --with pytest --with pyyaml python -m pytest tests -q
