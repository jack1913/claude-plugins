# The puppet-master plugin's checks: its node:test suite (a fake `run` answers every CLI call, so no Claude session
# starts) and the manifest, with no network beyond installing the pinned Claude Code CLI.
name: puppet-master

on:
  push:
    branches:
      - main
    paths:
      - "plugins/puppet-master/**"
      - ".github/workflows/puppet-master.yml"
  pull_request:
    paths:
      - "plugins/puppet-master/**"
      - ".github/workflows/puppet-master.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: plugins/puppet-master

env:
  # the Claude Code CLI that validates the manifest: the version brand-creator.yml pins (CLAUDE_CODE_VERSION)
  CLAUDE_CODE_VERSION: "2.1.302"

jobs:
  # named after the workflow: its check is the verdict a release tag puppet-master--v* needs (.github/rulesets/)
  puppet-master:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Tests (node:test)
        run: node --test tests/*.test.mjs
      # a CLI that cannot be installed fails the job: an unvalidated manifest must not pass the verdict
      - name: Install the Claude Code CLI
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version
      - name: claude plugin validate --strict
        run: claude plugin validate "$GITHUB_WORKSPACE/plugins/puppet-master" --strict
