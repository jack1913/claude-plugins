name: docs

# docs/internals/docs-standard.md §8. Every check fails the build.

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/.claude-plugin/*.json"
      - ".markdownlint-cli2.yaml"
      - "lychee.toml"
      - ".github/scripts/check-docs-standard.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "**/.claude-plugin/*.json"
      - ".markdownlint-cli2.yaml"
      - "lychee.toml"
      - ".github/scripts/check-docs-standard.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # named after the workflow: its check is the verdict every release tag needs, with the plugin's own (.github/rulesets/)
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Not a docs check: every release-tag ruleset requires this job, so this step checks the verdicts the rulesets rely on
      # on every commit a release tag can point to (marketplace.yml runs it, with --self-test, when a workflow changes).
      - name: Every workflow's verdict and timeouts, and every ruleset (check-workflows.py)
        run: python3 .github/scripts/check-workflows.py
      - name: Skills, agents, plugin.json, marketplace entries, changelogs, ADRs and AGENTS.md pointers
        run: python3 .github/scripts/check-docs-standard.py --strict
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
      - name: Relative links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml --root-dir ${{ github.workspace }} --no-progress './**/*.md'
          fail: true
