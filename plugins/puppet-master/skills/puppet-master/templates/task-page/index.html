<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta id="pmtoken" content="">
<title>puppet-master: work-set tasks</title>
<style>
  /* Style "Soft cards" (the user's pick, A30), light and dark. Tokens from the T28 canvas. */
  :root { color-scheme:light;
    --surface:#f1f2f5; --card:#ffffff; --card-quiet:#f8f9fb; --well:#f1f2f5; --line:#e2e5ec;
    --text:#1e2230; --text-2:#586074; --text-3:#626a7d; --accent:#3d5bd9;
    --wait:#8a5200; --wait-bg:#ffe9bd; --wait-soft:#fff6e3; --run:#2748b5; --run-bg:#e2eaff;
    --block:#a1261d; --block-bg:#fde3e0; --unread:#6a3cc0; --unread-bg:#efe6ff; --done:#1f6b3a; --done-bg:#e2f3e7;
    --queue:#4b5368; --queue-bg:#e7e9ef; --open:#00677a; --open-bg:#d3f1f6; --dot-busy:#2f9e5b; --dot-idle:#8a91a3;
    --shadow:0 1px 2px rgba(22,28,45,.06), 0 1px 1px rgba(22,28,45,.03);
    --shadow-pin:0 1px 0 #e2e5ec, 0 10px 16px -14px rgba(22,28,45,.35);
    --ui:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,sans-serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme:dark;
    --surface:#13151b; --card:#1d2028; --card-quiet:#181a21; --well:#282c37; --line:#313644;
    --text:#e9ebf1; --text-2:#aab1c2; --text-3:#949cb0; --accent:#93a8ff;
    --wait:#ffd791; --wait-bg:#4d3610; --wait-soft:#2a2416; --run:#bccaff; --run-bg:#22326d;
    --block:#ffb9b0; --block-bg:#5a231e; --unread:#d6c2ff; --unread-bg:#3b2a66; --done:#a3e3b8; --done-bg:#17402a;
    --queue:#c5cbd8; --queue-bg:#323745; --open:#7fe0ee; --open-bg:#0e3f4a; --dot-busy:#45c07a; --dot-idle:#6f7790;
    --shadow:0 0 0 1px rgba(255,255,255,.05), 0 1px 2px rgba(0,0,0,.35);
    --shadow-pin:0 1px 0 #313644, 0 10px 16px -12px rgba(0,0,0,.7); } }
  :root[data-theme="dark"] { color-scheme:dark;
    --surface:#13151b; --card:#1d2028; --card-quiet:#181a21; --well:#282c37; --line:#313644;
    --text:#e9ebf1; --text-2:#aab1c2; --text-3:#949cb0; --accent:#93a8ff;
    --wait:#ffd791; --wait-bg:#4d3610; --wait-soft:#2a2416; --run:#bccaff; --run-bg:#22326d;
    --block:#ffb9b0; --block-bg:#5a231e; --unread:#d6c2ff; --unread-bg:#3b2a66; --done:#a3e3b8; --done-bg:#17402a;
    --queue:#c5cbd8; --queue-bg:#323745; --open:#7fe0ee; --open-bg:#0e3f4a; --dot-busy:#45c07a; --dot-idle:#6f7790;
    --shadow:0 0 0 1px rgba(255,255,255,.05), 0 1px 2px rgba(0,0,0,.35);
    --shadow-pin:0 1px 0 #313644, 0 10px 16px -12px rgba(0,0,0,.7); }

  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--surface); color:var(--text); font:14.5px/1.55 var(--ui); display:flex; overflow:hidden; }
  a { color:var(--accent); text-decoration:none; cursor:pointer; } a:hover { text-decoration:underline; }
  button { font:inherit; color:inherit; }
  code { font:12.5px Consolas, monospace; word-break:break-all; }
  .mut { color:var(--text-2); } .mut3 { color:var(--text-3); }
  .hide { display:none !important; }
  .clamp2, .clamp3 { display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }
  .clamp2 { -webkit-line-clamp:2; } .clamp3 { -webkit-line-clamp:3; }
  .pill { display:inline-flex; padding:3px 11px; border-radius:999px; font-size:13px; font-weight:600; white-space:nowrap; line-height:1.45; }
  .k-wait { background:var(--wait-bg); color:var(--wait); } .k-run { background:var(--run-bg); color:var(--run); }
  .k-block { background:var(--block-bg); color:var(--block); } .k-unread { background:var(--unread-bg); color:var(--unread); }
  .k-done { background:var(--done-bg); color:var(--done); } .k-queue { background:var(--queue-bg); color:var(--queue); }
  /* open (not done) tasks: their own colour, teal (--open), a hue no status uses (blue running, amber waits, violet to read, green done, red blocked, grey queued): id, pill, left accent, faint tint */
  .k-open { background:var(--open-bg); color:var(--open); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--open) 40%, transparent); }
  .nw { display:inline-flex; width:22px; height:22px; border-radius:7px; background:var(--well); align-items:center; justify-content:center;
        font-size:12px; color:var(--text-2); flex:none; text-decoration:none !important; }
  .card { background:var(--card); border-radius:16px; box-shadow:var(--shadow); }

/* rail (collapsed sidebar, 88 px) and the opened sidebar (420 px): every status filter with its count, every session's record
     (the user, 11-27: "sidebar needs to be wider and it s all filters should move to it s collapsed version") */
  #rail { width:88px; flex:none; display:flex; flex-direction:column; align-items:center; gap:11px; padding:14px 6px; overflow-y:auto; scrollbar-width:none; }
  .iconbtn { width:40px; height:40px; border-radius:12px; border:0; display:flex; align-items:center; justify-content:center;
             background:var(--card); box-shadow:var(--shadow); color:var(--text-2); cursor:pointer; flex:none; }
  .iconbtn.flat { background:none; box-shadow:none; }
  .rc { display:flex; flex-direction:column; align-items:center; gap:2px; width:76px; font-size:12px; line-height:1.2; color:var(--text-2); cursor:pointer; background:none; border:0; padding:0; flex:none; }
  .rc i { font-style:normal; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:15px;
          background:var(--card); color:var(--text-2); box-shadow:var(--shadow); font-variant-numeric:tabular-nums; }
  .rc.on i { box-shadow:0 0 0 2px var(--accent); }
  .rc i.k-wait { background:var(--wait-bg); color:var(--wait); } .rc i.k-run { background:var(--run-bg); color:var(--run); }
  .rc i.k-block { background:var(--block-bg); color:var(--block); } .rc i.k-unread { background:var(--unread-bg); color:var(--unread); }
  .rc i.k-queue { background:var(--queue-bg); color:var(--queue); } .rc i.k-done { background:var(--done-bg); color:var(--done); }
  .rdiv { width:44px; border-top:1px solid var(--line); margin:2px 0; flex:none; }
  .rs { display:flex; flex-direction:column; align-items:center; gap:1px; font-size:11.5px; color:var(--text-2); width:76px; flex:none; }
  .rs b { font-weight:600; color:var(--text); font-size:12.5px; font-variant-numeric:tabular-nums; }
  .rs .bar { width:44px; }
  .bar { height:5px; border-radius:3px; background:var(--line); overflow:hidden; }
  .bar > span { display:block; height:100%; border-radius:3px; background:var(--dot-busy); } .bar > span.hi { background:var(--wait); }
  #rail .theme { margin-top:auto; }
  #side { width:420px; flex:none; padding:14px 8px 14px 14px; overflow-y:auto; }
  #side .card { padding:16px 16px 20px; display:flex; flex-direction:column; gap:20px; }
  .sidehead { display:flex; align-items:center; gap:10px; font-weight:600; font-size:15px; }
  .sidehead .iconbtn { width:32px; height:32px; box-shadow:none; background:var(--well); border-radius:10px; margin-left:auto; order:2; }
  .sidesec h3 { margin:0 0 6px; font-size:12.5px; font-weight:600; color:var(--text-3); letter-spacing:.02em; text-transform:uppercase; display:flex; align-items:center; gap:8px; }
  .sidesec h3 .tag { margin-left:auto; text-transform:none; letter-spacing:0; font-weight:500; }
  .srow { display:flex; justify-content:space-between; align-items:center; padding:7px 12px; border-radius:10px; cursor:pointer;
          width:100%; border:0; background:none; text-align:left; }
  .srow.on { background:var(--well); font-weight:600; }
  .srow .n { min-width:28px; text-align:center; border-radius:999px; font-size:13px; padding:0 6px; color:var(--text-2); font-variant-numeric:tabular-nums; }
  .srow .n.hot { font-weight:600; }
  .srow .n.k-wait { background:var(--wait-bg); color:var(--wait); } .srow .n.k-unread { background:var(--unread-bg); color:var(--unread); }
  .srow .n.k-block { background:var(--block-bg); color:var(--block); } .srow .n.k-run { background:var(--run-bg); color:var(--run); }
  .srow.first-origin { margin-top:8px; position:relative; }
  .srow.first-origin::before { content:""; position:absolute; left:12px; right:12px; top:-5px; border-top:1px solid var(--line); }
  .srow .n.zero { color:var(--text-3); opacity:.7; background:none; }
  /* a session: its context share with a bar, and what it is doing (the user, 11-27: no raw token counts) */
  .ssess { padding:7px 12px; border-radius:10px; }
  .ssess .t { display:grid; grid-template-columns:12px minmax(0,1fr) auto; gap:0 10px; align-items:center; }
  .ssess .t .dot { margin:0; }
  .ssess .nm { font-weight:600; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ssess .pc { font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--text-2); }
  .ssess .job { margin:2px 0 4px 22px; font-size:12.5px; color:var(--text-2); line-height:1.4; overflow-wrap:anywhere; }
  .ssess .bar { margin-left:22px; }
  .ssess .md { margin:3px 0 0 22px; font-size:11.5px; color:var(--text-3); }
  .ssess.folded .job, .ssess.folded .bar, .ssess.folded .md { display:none; }
  .prev { padding:6px 12px; font-size:13.5px; border-top:1px solid var(--line); }
  .prev:first-of-type { border-top:0; }
  .prev .d { color:var(--text-2); font-size:12.5px; }
  .prev .o { color:var(--text-3); font-size:12.5px; margin-top:2px; }
  .seg { display:flex; background:var(--well); border-radius:10px; padding:3px; }
  .seg button { flex:1; border:0; background:none; padding:4px 0; border-radius:8px; cursor:pointer; font-size:13px; color:var(--text-2); }
  .seg button.on { background:var(--card); box-shadow:var(--shadow); color:var(--text); font-weight:600; }
  /* Collapse all / Expand all: one switch in the heading of each list with several foldable parts */
  .sw { margin-left:auto; display:inline-flex; background:var(--well); border-radius:9px; padding:2px; font-size:12.5px; flex:none; }
  .sw button { border:0; background:none; padding:2px 10px; border-radius:7px; color:var(--text-2); cursor:pointer; font-size:12.5px; }
  .sw button.on { background:var(--card); box-shadow:var(--shadow); color:var(--text); font-weight:600; }
  body:not(.side-open) #side { display:none; } body.side-open #rail { display:none; }

  /* main column: pinned header, waiting line, tab bar, then the scrolling pane */
  #main { flex:1; min-width:0; display:flex; flex-direction:column; padding:0 24px 0 0; }
  body.side-open #main { padding-left:8px; }
  header { height:68px; flex:none; display:flex; align-items:center; gap:14px; padding:0 6px; }
  header h1 { font-size:16px; margin:0; white-space:nowrap; }
  #workset { color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .chip { display:inline-flex; padding:4px 12px; border-radius:999px; font-size:13px; font-weight:600; white-space:nowrap; cursor:pointer; border:0; }
  #askchip { margin-left:auto; }
  #updated { color:var(--text-2); font-size:13.5px; white-space:nowrap; }
  #waiting { flex:none; margin:0 6px 10px; padding:8px 14px; border-radius:12px; background:var(--wait-soft); font-size:13.5px; overflow-wrap:anywhere; }
  #waiting.calm { background:var(--card-quiet); color:var(--text-2); }
  #waiting b { font-weight:600; }
  #tabs { flex:none; display:flex; gap:6px; padding:0 6px 10px; border-bottom:1px solid var(--line); margin-bottom:2px; }
  #tabs button { border:0; background:none; padding:7px 16px; border-radius:999px; cursor:pointer; font-size:14.5px; color:var(--text-2);
                 display:inline-flex; gap:8px; align-items:baseline; }
  #tabs button.on { background:var(--card); box-shadow:var(--shadow); color:var(--text); font-weight:600; }
  #tabs button b { font-variant-numeric:tabular-nums; font-weight:600; }
  #tabs button b.hot { color:var(--wait); }
  #scroller { flex:1; min-height:0; overflow-y:auto; padding:12px 4px 32px; margin:0 -4px; scrollbar-width:thin; scrollbar-color:var(--dot-idle) transparent; }
  #scroller.pinned { box-shadow:inset 0 10px 10px -12px rgba(0,0,0,.25); }
  .pane > * + * { margin-top:18px; }
  .foot { color:var(--text-3); font-size:13px; padding:0 6px; }

  /* Questions */
  .qcard { padding:20px 24px 18px; }
  .qhead { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .qhead h2 { margin:0; font-size:16px; }
  .qhead .right { margin-left:auto; font-size:13px; color:var(--text-3); }
  .ask { background:var(--wait-soft); border-radius:14px; padding:16px 18px 14px; margin-top:14px; scroll-margin-top:12px; }
  .ask.flash { outline:2px solid var(--wait); }
  .ask .meta { display:flex; gap:12px; flex-wrap:wrap; font-size:13px; color:var(--text-2); align-items:center; }
  .ask .meta b { color:var(--wait); }
  .ask h3 { margin:6px 0 10px; font-size:16px; font-weight:600; text-wrap:pretty; overflow-wrap:anywhere; }
  .fact { display:grid; grid-template-columns:112px minmax(0,1fr); gap:0 12px; align-items:start; margin-top:8px; font-size:14px; }
  .fact .l { color:var(--text-2); font-size:13.5px; }
  .fact .v { text-wrap:pretty; overflow-wrap:anywhere; }
  .fact .q { background:var(--card); border-radius:10px; padding:10px 14px; text-wrap:pretty; overflow-wrap:anywhere; }
  .fact.rec .l { color:var(--done); font-weight:600; } .fact.rec .v { font-weight:600; }
  .ask .af { display:flex; justify-content:space-between; gap:12px; margin-top:12px; font-size:13px; color:var(--text-3); }
  .ask .af a { font-weight:600; white-space:nowrap; }
  .calmh { margin:14px 0 2px; font-size:20px; font-weight:600; }
  details.ans { margin-top:16px; border-top:1px solid var(--line); padding-top:10px; }
  details.ans summary { cursor:pointer; display:flex; gap:10px; align-items:baseline; list-style:none; }
  details.ans summary::-webkit-details-marker { display:none; }
  details.ans summary::before { content:"▸"; color:var(--text-3); font-size:12px; }
  details.ans[open] summary::before { content:"▾"; }
  details.ans summary .r { margin-left:auto; font-size:13px; color:var(--text-3); }
  .arow { display:grid; grid-template-columns:52px minmax(0,1fr) 84px; gap:0 14px; padding:4px 0 4px 16px; border-top:1px solid var(--line); align-items:baseline; font-size:13.5px; }
  .arow .an { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-2); }
  .arow .at { color:var(--text-3); font-size:12.5px; text-align:right; white-space:nowrap; }
  .arh { display:flex; gap:10px; align-items:baseline; margin-top:12px; padding-bottom:4px; font-size:13.5px; min-width:0; }
  .arh .tt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-2); min-width:0; }
  /* open asks grouped under their task (the user, 11-27: "group questions from single task") */
  .qtask { margin-top:18px; padding-top:14px; border-top:1px solid var(--line); }
  .qtask:first-of-type { border-top:0; }
  .qth { display:flex; gap:10px; align-items:center; font-size:14px; min-width:0; }
  .qth .tid { font-weight:600; }
  .qth .ch { color:var(--text-3); font-size:12px; width:12px; cursor:pointer; }
  .qth .tt { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .qth .pill { padding:1px 9px; font-size:12.5px; }
  .qth .r { font-size:13px; color:var(--text-3); white-space:nowrap; }
  .qtask .ask { margin-top:10px; }
  .now { display:grid; grid-template-columns:112px minmax(0,1fr); gap:4px 12px; margin-top:16px; padding-top:12px; border-top:1px solid var(--line); font-size:13.5px; }
  .now .l { color:var(--text-2); }

  /* Side questions: the user's side questions to the master, the newest first (the user, 11-27) */
  .sq { display:grid; grid-template-columns:96px minmax(0,1.3fr) minmax(0,1fr) 96px; gap:0 18px; padding:10px 0; border-top:1px solid var(--line); font-size:13.5px; align-items:start; }
  .sq.h { font-size:12.5px; color:var(--text-3); border-top:0; padding:12px 0 4px; }
  .sq .q { white-space:pre-wrap; overflow-wrap:anywhere; }
  .sq .a { color:var(--text-2); white-space:pre-wrap; overflow-wrap:anywhere; }
  .sq .t { color:var(--text-3); font-size:12.5px; font-variant-numeric:tabular-nums; }
  .compact .sq { grid-template-columns:84px minmax(0,1.3fr) minmax(0,1fr) 84px; gap:0 14px; }
  #main.tight .sq { grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:4px 14px; }
  #main.tight .sq .t:first-child { grid-column:1 / -1; }
  #main.tight .sq.h { display:none; }

  /* Jira freshness: when each line was read, stale after STALE_H hours (the user, 11-27: "jira tasks list seems not updated too often") */
  /* (scoped to [data-fresh]: .dot.fresh is a session that has not started, in the sidebar) */
  .fresh[data-fresh] { margin-top:10px; padding:8px 12px; border-radius:10px; background:var(--card-quiet); font-size:13.5px; color:var(--text-2); }
  .fresh.stale[data-fresh] { background:var(--wait-soft); color:var(--text); }
  .fresh.stale[data-fresh] b { color:var(--wait); }

  /* Tasks */
  .scard { padding:16px 22px 14px; }
  .cardh { display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
  .cardh h2 { margin:0; font-size:15.5px; }
  .cardh .cap { font-size:13px; color:var(--text-3); }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; display:inline-block; margin-right:9px; vertical-align:0; }
  .dot.busy { background:var(--dot-busy); } .dot.idle { background:var(--dot-idle); } .dot.fresh { box-shadow:inset 0 0 0 1.5px var(--dot-idle); }
  .dot.warn { background:var(--wait); }
  .orderline { font-size:13px; color:var(--text-3); padding:0 8px; }
  .orderline b { color:var(--text); font-weight:600; }
  .seenbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:10px 16px; border-radius:12px; background:var(--unread-bg); color:var(--unread); font-size:13.5px; }
  .seenbar code { background:var(--card); color:var(--text); padding:2px 8px; border-radius:6px; user-select:all; }
  .btn { border:0; border-radius:8px; padding:3px 10px; cursor:pointer; font-size:13px; font-weight:600; background:var(--card); color:var(--accent); box-shadow:var(--shadow); white-space:nowrap; }
  /* Mark seen is a button, not a status: outlined and neutral, never the Pending report pill's colour (the user, 11-26) */
  .btn.seen { background:transparent; color:var(--text); box-shadow:none; border:1px solid var(--text-3); padding:2px 10px; margin-top:8px; }
  .btn.seen:hover { background:var(--well); border-color:var(--text-2); }
  .btn:focus-visible, #pgrip:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
/* the task table (the accepted canvas, 11-27): # | title, one line of what is new, Show more | status, who | the 3 newest reports.
     Group headings fold; done tasks are a filter, not a section. */
  .lh { display:flex; align-items:center; gap:10px; padding:0 6px; }
  .lh h2 { margin:0; font-size:15.5px; } .lh .cap { font-size:13px; color:var(--text-3); }
  .grp { padding:6px 6px 10px; }
  .tgh { display:flex; align-items:center; gap:8px; padding:6px 14px 4px; font-weight:600; font-size:14px; cursor:pointer; }
  .tgh .cap { font-weight:400; font-size:12.5px; color:var(--text-3); } .tgh .ch { color:var(--text-3); font-size:12px; width:12px; }
  .thead, .trow { display:grid; grid-template-columns:38px minmax(0,1fr) 124px 168px; gap:0 12px; align-items:start; }
  .thead { padding:0 26px 0 20px; font-size:12.5px; color:var(--text-3); }
  .trow { padding:10px 14px; border-top:1px solid var(--line); scroll-margin-top:12px; }
  .tgh + .trow { border-top:0; }
  .trow.flash { outline:2px solid var(--accent); outline-offset:-2px; border-radius:8px; }
  .srow .n.k-open { color:var(--open); } .rc i.k-open { background:var(--open-bg); color:var(--open); }
  .trow .id { font-weight:600; font-variant-numeric:tabular-nums; color:var(--open); }
  .trow:not(.done) { box-shadow:inset 3px 0 0 var(--open); }
  .trow .ti { font-weight:600; text-wrap:pretty; overflow-wrap:anywhere; }
  .trow.done .id, .trow.done .ti { color:var(--text-2); font-weight:400; }
  .trow .s1 { margin-top:3px; font-size:13px; color:var(--text-2); overflow-wrap:anywhere; }
  .trow .more { margin-top:3px; font-size:13px; font-weight:600; display:block; }
  .trow .more a, .trow .rmore a { font-weight:600; cursor:pointer; }
  .trow .stc .st { display:flex; gap:4px; flex-wrap:wrap; }

/* compact: narrow window, sidebar open or panel open */

/* Epics and Jira: one card per epic, backend first (the accepted canvas): left the epic, right a block per repo */

  .lineout { margin-top:10px; padding:8px 12px; border-radius:10px; background:var(--card); font-size:13px; }

  .trow .dots { border:0; background:none; font-weight:700; color:var(--text-3); padding:0 6px; border-radius:6px; cursor:pointer; margin-left:10px; font-size:15px; line-height:1; }

  .menu { position:fixed; background:var(--card); border-radius:12px; box-shadow:0 10px 30px rgba(20,25,40,.28), 0 0 0 1px var(--line); padding:6px; width:330px; z-index:8; font-size:13.5px; }
  .menu .mi { padding:7px 12px; border-radius:8px; display:flex; gap:10px; align-items:baseline; width:100%; border:0; background:none; text-align:left; cursor:pointer; }

  .menu .mi.req { color:var(--text-2); }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:9; background:var(--text); color:var(--card); padding:8px 16px; border-radius:10px; font-size:13.5px; max-width:80vw; overflow-wrap:anywhere; }
  #pgrill { padding:14px 18px 18px; display:flex; flex-direction:column; gap:12px; overflow-y:auto; flex:1; }

<script>
  // Reads window.DASH from tasks.js (shape: the comment at the top of tasks.js). Writes nothing but the browser's
  // localStorage: the tab, the filter, expanded tasks, the panel and its width, the theme, and the "seen" marks.
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  // A link out (Jira, GitHub): https only, a new tab; with no URL the text stays plain
  const webUrl = u => /^https:\/\/[^\s"<>]+$/.test(String(u || "")) ? String(u) : "";
  const ext = (url, html) => webUrl(url) ? `<a class="ext" href="${esc(webUrl(url))}" target="_blank" rel="noopener">${html}</a>` : html;
  // The Jira keys and PR numbers the Jira tab knows, linked where a task's title or lines name them.
  // A PR number is linked only when one PR on the board has it (#65 in two repos stays plain).
  let REFS = { keys: {}, prs: {} };
  function readRefs(D) {
    const keys = {}, prs = {};
    for (const e of D.epics || []) for (const r of e.repos || []) {
      const j = r.jira || {}, pu = webUrl(r.prUrl || r.url), n = String(r.pr || "").replace(/^#/, "");
      if (j.key && webUrl(j.url)) keys[j.key] = j.url;
      if (/^\d+$/.test(n) && pu) (prs[n] = prs[n] || new Set()).add(pu);
    }

      .sort((a, b) => (a[0] === "" ? 1 : 0) - (b[0] === "" ? 1 : 0) || a[0].localeCompare(b[0], "en", { numeric: true, sensitivity: "base" }));
  }

  // ---------- header, waiting line, tabs, rail and sidebar ----------
  function renderChrome(D, M) {
    document.getElementById("workset").textContent = (D.workSet ? D.workSet : "") + (D.days && D.days.length ? " · day " + D.days.length : "");
    document.getElementById("workset").title = (D.days || []).join(", ");
    document.getElementById("updated").textContent = "Updated " + String(D.updated || "-").slice(11);
    document.getElementById("updated").title = D.updated || "";
    const lk = linkChipHtml(), lc = document.getElementById("linkchip");
    lc.className = "lc " + lk[0]; lc.title = lk[2];
    lc.innerHTML = `<span class="dot ${lk[0] === "live" ? "busy" : lk[0] === "copy" ? "idle" : "warn"}"></span>${esc(lk[1])}`;
    const nAsk = M.openAsks.length, nWaitTasks = M.C.wait;
    const ask = document.getElementById("askchip");
    ask.className = "chip " + (nAsk || nWaitTasks ? "k-wait" : "k-done");
    ask.textContent = nAsk ? nAsk + (nAsk > 1 ? " asks wait for you" : " ask waits for you")
      : nWaitTasks ? nWaitTasks + (nWaitTasks > 1 ? " tasks wait for you" : " task waits for you") : "Nothing waits for you";
    const rc = document.getElementById("readchip");
    rc.classList.toggle("hide", !M.C.pend);
    rc.textContent = M.C.pend + (M.C.pend > 1 ? " reports to read" : " report to read");
    const w = document.getElementById("waiting");
    w.innerHTML = "<b>Now:</b> " + esc(D.waitingNow || "-");
    w.classList.toggle("calm", /^Nothing waits/.test(D.waitingNow || "") || (!nAsk && !nWaitTasks));
    const tc = { questions: [nAsk, nAsk > 0], tasks: [M.C.open, false], jira: [(D.epics || []).length, false], side: [(D.sideQuestions || []).length, false] };
    document.getElementById("tabs").innerHTML = TABS.map(([k, label]) =>
      `<button role="tab" data-tab="${k}" class="${k === tab ? "on" : ""}" aria-selected="${k === tab}">${label}<b class="${tc[k][1] ? "hot" : ""}">${tc[k][0]}</b></button>`).join("");
    for (const [k] of TABS) document.getElementById("pane-" + k).classList.toggle("hide", k !== tab);
    const ss = sessions(D);
    const on = f => tab === "tasks" && filter === f;
    // rail (sidebar closed, 88 px): every filter as a count circle and a word, then every session as a dot, its context % and a bar;
    // each filter switches the Tasks filter (the user, 11-27: "all filters should move to it s collapsed version")
    document.getElementById("railcounts").innerHTML = M.filters.map(f =>
      `<button class="rc${on(f[0]) ? " on" : ""}" data-go="${esc(f[0])}" title="${esc("Show the " + f[1].toLowerCase() + " tasks")}"><i class="${M.C[f[0]] && f[2] ? "k-" + f[2] : ""}">${M.C[f[0]]}</i>${esc(RAILW[f[0]] || f[1].toLowerCase())}</button>`).join("")
      + `<div class="rdiv"></div>` + ss.map(x => `<div class="rs" title="${esc(x.name + " · " + x.state + " · " + doing(x))}"><span class="dot ${x.dot}" style="margin:0"></span><b>${esc(x.pct)}</b>`
      + `<div class="bar"><span class="${x.pctN >= 70 ? "hi" : ""}" style="width:${x.pctN}%"></span></div>${esc(String(x.name).split("-").pop())}</div>`).join("");
    // the sidebar holds every status filter of the Tasks tab with its count, 0 included, and a row for any other status in tasks.js
    document.getElementById("sidetag").textContent = M.tasks.length + " tasks";
    document.getElementById("sidefilters").innerHTML = M.filters.map(f =>
      `<button class="srow${on(f[0]) ? " on" : ""}${f[0] === "initial" ? " first-origin" : ""}" data-go="${esc(f[0])}"><span>${esc(f[1])}</span><span class="n${!M.C[f[0]] ? " zero" : f[2] && f[2] !== "done" ? " hot k-" + f[2] : ""}">${M.C[f[0]]}</span></button>`).join("");
    // every session's record: name, context % with a bar, what it is doing, state and model (no raw token counts)
    document.getElementById("sesshead").textContent = "Session records" + (D.sessionsAsOf ? " · as of " + D.sessionsAsOf : "");
    document.getElementById("sesssw").innerHTML = switchHtml("sess", ss.length ? ["sess"] : [], () => true);
    document.getElementById("sidesess").innerHTML = ss.map(x =>
      `<div class="ssess${fold.has("sess") ? " folded" : ""}" title="${esc(x.name + " · " + x.state + " · " + (x.model || "-") + " · " + doing(x))}">`
      + `<div class="t"><i class="dot ${x.dot}"></i><span class="nm">${esc(x.name)}</span><span class="pc">${esc(x.pct)}</span></div>`
      + `<div class="job">${esc(doing(x))}</div><div class="bar"><span class="${x.pctN >= 70 ? "hi" : ""}" style="width:${x.pctN}%"></span></div>`
      + `<div class="md">${esc(x.state || "-")} · ${esc(x.model || "-")}</div></div>`).join("")
      || `<div class="mut" style="padding:0 12px;font-size:13px">No session listed yet: run sync-sessions.mjs.</div>`;
    const prev = (D.previous || []).slice().sort((a, b) => String(b.days || b.label).localeCompare(String(a.days || a.label)));
    document.getElementById("prevsec").classList.toggle("hide", !prev.length);
    document.getElementById("prev").innerHTML = prev.map(p =>
      `<div class="prev"><a href="${esc(fileUrl(p.path))}" target="_blank" title="Open its master page in a new window">${esc(p.label)} ↗</a>`
      + `<div class="d">${esc(p.days)}${p.tasks ? " · " + esc(p.tasks) : ""}</div>${p.open ? `<div class="o clamp3" title="${esc(p.open)}">Left open: ${esc(p.open)}</div>` : ""}</div>`).join("");
    document.querySelectorAll("#themeseg button").forEach(b => b.classList.toggle("on", b.dataset.theme === theme));
  }

  // Sessions: master, working, analyst, clean (then anything else); by name within each.
  function sessions(D) {
    const rank = s => /^master/.test(s.state) ? 0 : /^working/.test(s.state) ? 1 : /^analyst/.test(s.state) ? 2 : /^clean/.test(s.state) ? 3 : 4;
    return (D.sessions || []).slice().sort((a, b) => rank(a) - rank(b) || String(a.name).localeCompare(String(b.name))).map(s => {
      const ctx = String(s.context || "");
      const m = ctx.match(/^([\d,]+) \(([^)]*)\)$/);
      const fresh = /fresh/.test(ctx) || /fresh|clean/.test(s.state);
      const dot = /^changed|blocked/.test(s.state) ? "warn" : /busy|working|master/.test(s.state) && !/idle/.test(s.state) ? "busy" : fresh ? "fresh" : "idle";
      const pctN = m ? Math.max(0, Math.min(100, Math.round(parseFloat(m[2]) || 0))) : 0;
      return Object.assign({}, s, { dot, fresh, pctN, pct: m ? pctN + "%" : (ctx || "-") });
    });
  }
  // what a session is doing: its job (a brief path reads as its name), or "no job"
  const doing = x => { const j = jobName(x.job); return !j || j === "-" ? "no job" + (x.fresh ? " · fresh" : "") : j; };
  // Collapse all / Expand all: one switch in a list's heading; "on" shows when every part is in that state, neither when mixed
  function switchHtml(which, keys, rowsOpen) {
    const nFold = keys.filter(k => fold.has(k)).length;
    const allFolded = keys.length > 0 && nFold === keys.length, allOpen = nFold === 0 && (!rowsOpen || rowsOpen());
    return `<button data-all="${which}" data-mode="collapse" class="${allFolded ? "on" : ""}">Collapse all</button><button data-all="${which}" data-mode="expand" class="${allOpen && keys.length ? "on" : ""}">Expand all</button>`;
  }
  // the fold keys (and the task ids whose rows open) of each list
  function listKeys(which) {
    const M = LM, D = window.DASH;
    if (which === "sess") return { keys: ["sess"], ids: [] };
    if (which === "questions") return { keys: byTask(M, M.openAsks).map(a => "q:" + a[1]), ids: [] };
    if (which === "jira") return { keys: (D.epics || []).map(e => "e:" + e.epic), ids: [] };
    const list = tasksList(M);
    return { keys: grouped(list).map(g => "g:" + g[0]), ids: list.map(x => x.t.id) };
  }

  // ---------- Questions ----------
  function factHtml(f) {
    const kind = f.kind || "text";
    const v = kind === "quote" ? `<div class="q">${esc(f.text)}</div>`
      : kind === "link" ? `<div class="v" style="display:flex;gap:8px;align-items:flex-start"><a class="doc" data-url="${esc(fileUrl(f.path || f.text))}" data-label="${esc(f.text)}">${esc(f.text)}</a><a class="nw" href="${esc(fileUrl(f.path || f.text))}" target="_blank" title="Open in a new window">↗</a></div>`
      : `<div class="v">${esc(f.text)}</div>`;
    return `<div class="fact"><div class="l">${esc(f.label)}</div>${v}</div>`;
  }
  // asks grouped by their task: [[task model or null, task id, asks]], tasks by id, asks by id, lowest first
  function byTask(M, asks) {
    const m = new Map();
    for (const a of asks) { const k = String(a.task || "-"); if (!m.has(k)) m.set(k, []); m.get(k).push(a); }
    return [...m.entries()].sort((a, b) => num(a[0]) - num(b[0]))
      .map(([id, list]) => [M.tasks.find(x => x.t.id === id) || null, id, list.sort((a, b) => num(a.id) - num(b.id))]);
  }
  function renderQuestions(D, M) {
    const nAsk = M.openAsks.length, nNoHurry = M.openAsks.filter(a => a.noHurry).length;
    let h = `<div class="card qcard" data-questions><div class="qhead"><h2>Questions</h2>`
      + `<span class="chip ${nAsk ? "k-wait" : "k-done"}" style="cursor:default">${nAsk ? nAsk + " open" + (nNoHurry ? " · " + nNoHurry + " of them no hurry" : "") : "0 open"}</span>`
      + (nAsk > 1 ? `<span class="mut3" style="font-size:13px">grouped by task; tasks and asks by id, lowest first</span>` : "")
      + (nAsk > 1 ? `<span class="sw">${switchHtml("questions", byTask(M, M.openAsks).map(a => "q:" + a[1]))}</span>` : "")
      + `<span class="right">${SERVED ? "Answer below: Send reaches the master, Copy builds the line to paste" : "Answer below with Copy, then paste the line into the master's window"}</span></div>`;
    if (!nAsk) h += `<div class="calmh">Nothing waits for you</div><div class="mut">No ask is open in any task. ${M.answered.length} asks answered on this board, below.</div>`;
    // the asks of one task together, under that task's heading (the user, 11-27: "group questions from single task")
    h += byTask(M, M.openAsks).map(([x, id, list]) => `<div class="qtask" data-qtask="${esc(id)}"><div class="qth"><span class="ch" data-fold="q:${esc(id)}" title="Fold or open this task's asks">${fold.has("q:" + id) ? "▸" : "▾"}</span><a class="tid" data-jump="${esc(id)}">${esc(id)}</a>`
      + (x ? `<span class="pill k-${x.colour}">${esc(x.label)}</span><span class="tt" title="${esc(x.t.title)}">${esc(x.t.title)}</span>` : `<span class="tt mut">not on this board</span>`)
      + `<span class="r">${list.length} open</span></div>`
      + (fold.has("q:" + id) ? "" : list.map(a => `<div class="ask${askSent(a.id) ? " ok" : ""}" id="ask-${esc(a.id)}">`
      + `<div class="meta">${askSent(a.id) ? `<span class="pill k-done">Sent</span>` : ""}<b>${esc(a.id)}</b>${a.asked ? `<span>asked ${esc(a.asked)}</span>` : ""}`
      + (a.movedFrom ? `<span>moved here from ${esc(a.movedFrom)}</span>` : "") + (a.thread ? `<span class="pill k-unread" style="padding:1px 9px">Grill me ${esc(a.thread)}</span>` : "") + (a.noHurry ? `<span class="pill k-queue" style="padding:1px 9px">No hurry</span>` : "") + `</div>`
      + `<h3>${esc(a.question)}</h3>` + (a.facts || []).map(factHtml).join("")
      + (a.recommend ? `<div class="fact rec"><div class="l">Recommended</div><div class="v">${esc(a.recommend)}</div></div>` : "")
      + formHtml(a)
      + `<div class="af"><span>${a.noHurry ? "Counts like any open ask; it stays here until you answer it." : "Stays here until you answer it, also while its task is done."}</span><a data-jump="${esc(a.task)}" data-rep="${esc(a.id)}" title="Opens its report beside and the task in the list">Open ${esc(a.task)} ↓</a></div></div>`).join("")) + `</div>`).join("");
    if (M.answered.length) h += `<details class="ans"${nAsk ? "" : " open"}><summary><b>Answered</b><span class="mut">${M.answered.length}</span><span class="r">grouped by task, by id; the whole line is in its task</span></summary>`
      + byTask(M, M.answered).map(([x, id, list]) => `<div class="arh"><a data-jump="${esc(id)}"><b>${esc(id)}</b></a><span class="tt" title="${esc(x ? x.t.title : "")}">${esc(x ? x.t.title : "")}</span></div>`
        + list.map(a => `<div class="arow"><b>${esc(a.id)}</b><span class="an" title="${esc(a.answer)}">${esc(a.answer || "-")}</span><span class="at">${esc(a.answered || "")}</span></div>`).join("")).join("")
      + `</details>`;
    const ids = k => M.tasks.filter(x => x.key === k).sort((a, b) => a.n - b.n);
    const run = ids("run").map(x => `<a data-jump="${esc(x.t.id)}">${esc(x.t.id)}</a> (${esc(splitWho(x.t.who)[0])})`).join(" · ");
    const queue = ids("queue").map(x => `<a data-jump="${esc(x.t.id)}">${esc(x.t.id)}</a>`).join(" · ");
    h += `<div class="now"><span class="l">Running</span><span>${run || "nothing"}</span><span class="l">Queued next</span><span>${queue || "nothing"}</span></div></div>`;
    document.getElementById("pane-questions").innerHTML = h;
  }

  // ---------- Tasks ----------
  function linesHtml(x) {
    const t = x.t, sub = t.sub || [];
    if (!sub.length) return "";
    // shown only in an expanded row: the newest SHOWN lines, the rest behind "Show N earlier lines"
    const shown = full.has(t.id) ? sub : sub.slice(0, SHOWN);
    const rest = sub.length - shown.length;
    let h = shown.map((s, i) => {
      const p = parseLine(s), key = t.id + ":" + i, isOpen = lines.has(key), len = [...s].length, long = len >= LONG;
      const meta = long ? `<div class="meta"><a data-line="${esc(key)}">${isOpen ? "Shown whole below · close it" : "Open the whole line · " + fmt(len) + " characters"}</a></div>` : "";
      const body = (p.head ? `<div class="head">${linkRefs(p.head)}</div>` : "")
        + (isOpen && long ? "" : `<div class="tx ${isOpen ? "" : "clamp3"}">${linkRefs(p.text)}</div>`) + meta;
      return `<div class="ln"><div class="lead">${esc(p.lead)}</div><div>${body}</div><button class="chev" data-line="${esc(key)}" title="${isOpen ? "Close this line" : "Open this line"}">${isOpen ? "⌄" : "›"}</button></div>`;
    }).join("");
    if (rest > 0) h += `<div class="more"><a data-full="${esc(t.id)}">Show ${rest} earlier line${rest > 1 ? "s" : ""}</a></div>`;
    return h;
  }
  function readingRows(x) {
    const t = x.t, sub = t.sub || [];
    return sub.map((s, i) => [s, i]).filter(([s, i]) => lines.has(t.id + ":" + i) && [...s].length >= LONG).map(([s, i]) => {
      const p = parseLine(s), len = [...s].length;
      return `<div class="reading"><div class="rh"><span>${esc(p.lead ? p.lead + " · " : "")}${fmt(len)} characters, the whole line</span><a data-line="${esc(t.id + ":" + i)}">Close this line ^</a></div>`
        + (p.head ? `<div style="font-weight:600;margin-top:6px">${linkRefs(p.head)}</div>` : "") + `<div class="tx${len > 1200 ? " cols" : ""}">${linkRefs(p.text)}</div></div>`;
    }).join("");
  }
  // a report line: a link that opens in the panel, ↗ for a new window; not written yet: a muted note, never a chip that looks like a deliverable
  function repHtml(x, rep) {
    const t = x.t;
    if (rep.pending || !rep.path) return `<div class="rep"><span class="pend" title="${esc(rep.path || "")}">${esc(String(rep.label || "report").replace(/\s*(\(pending\)|· pending)\s*$/, ""))} <i>· not written yet</i></span></div>`;
    const u = fileUrl(rep.path), unread = x.key === "pend";
    return `<div class="rep${unread ? " unread" : ""}">${unread ? `<i class="rd"></i>` : ""}<a class="doc${panel && panel.url === u ? " cur" : ""}" data-url="${esc(u)}" data-label="${esc(t.id + ": " + rep.label)}" data-task="${esc(t.id)}">${esc(rep.label)}</a>`
      + `<a class="nw" href="${esc(u)}" target="_blank" title="Open in a new window">↗</a></div>`;
  }
  // the 3 newest reports (reports[] is oldest first), the rest behind "Show more · n"
  function reportsHtml(x) {
    const t = x.t, r = (t.reports || []).slice().reverse();
    if (!r.length) return `<div class="rp"><span class="mut3">${t.evidence && t.evidence !== "-" ? "no HTML report" : "–"}</span></div>`;
    const all = rall.has(t.id), shown = all ? r : r.slice(0, 3), rest = r.length - shown.length;
    return `<div class="rp">` + shown.map(rep => repHtml(x, rep)).join("")
      + (rest > 0 ? `<div class="rmore"><a data-rall="${esc(t.id)}">Show more · ${rest}</a></div>` : all && r.length > 3 ? `<div class="rmore"><a data-rall="${esc(t.id)}">Show fewer</a></div>` : "") + `</div>`;
  }
  // One row per task, as drawn in the accepted canvas: # | title, one line of what is new, Show more | status and who | reports.
  function rowHtml(x) {
    const t = x.t, exp = open.has(t.id), sub = t.sub || [];
    const flag = x.blocked ? `<span class="pill k-block" title="${esc(x.blocked)}">Blocked</span>`
      : x.asks.length && x.key !== "wait" ? `<span class="pill k-wait">Ask open</span>` : "";
    const more = exp ? "Show less" : sub.length > 1 ? "Show more · " + (sub.length - 1) + " more line" + (sub.length > 2 ? "s" : "") : "Show more";
    return `<div class="trow${x.key === "done" ? " done" : ""}${exp ? " on" : ""}" data-task="${esc(t.id)}" id="task-${esc(t.id)}">`
      + `<span class="id">${esc(t.id)}</span>`
      + `<div class="tk"><div class="ti" title="${esc(t.title)}">${linkRefs(t.title)}</div>${exp || !sub.length ? "" : `<div class="s1 clamp2">${linkRefs(sub[0])}</div>`}`
      + `<div class="more"><a data-exp="${esc(t.id)}" aria-expanded="${exp}">${more}</a><button class="dots${menuTask === t.id ? " on" : ""}" data-menu="${esc(t.id)}" aria-haspopup="menu" aria-label="Actions for ${esc(t.id)}" title="Actions for ${esc(t.id)}">⋯</button></div></div>`
      + `<div class="stc"><div class="st"><span class="pill k-${x.colour}">${esc(x.label)}</span>${flag}</div><small class="clamp2" title="${esc(t.who || "")}">${esc(t.who || "")}</small></div>`
      + reportsHtml(x) + `</div>`
      // an open ask answers inline on its task's row too (the accepted canvas, Answer)
      + x.asks.map(a => `<div class="ask inl${askSent(a.id) ? " ok" : ""}" data-inl="${esc(a.id)}"><div class="meta">${askSent(a.id) ? `<span class="pill k-done">Sent</span>` : ""}<b>${esc(a.id)}</b><span>${a.asked ? "asked " + esc(a.asked) : "open"}</span></div>`
        + `<div style="font-weight:600;margin:4px 0">${esc(a.question)}</div>${formHtml(a)}</div>`).join("")
      + (exp ? detailHtml(x) : "");
  }
  function detailHtml(x) {
    const t = x.t, [who, whoSub] = splitWho(t.who);
    const kv = (label, html) => html ? `<span class="l">${label}</span><div>${html}</div>` : "";
    const strips = x.asks.map(a => `<div class="strip"><b>${esc(a.id)} open${a.noHurry ? " · no hurry" : ""}</b><span title="${esc(a.question)}">${esc(a.question)}</span><a data-ask="${esc(a.id)}">See it in Questions ↑</a></div>`).join("");
    const status = x.blocked || x.key === "pend" || x.seenHere
      ? `<span class="pill k-${x.colour}">${esc(x.label)}</span>`
        + (x.blocked ? ` <span class="pill k-block">Blocked</span> <span class="blk">${esc(x.blocked)}</span>` : "")
        + (x.key === "pend" ? ` <button class="btn seen" data-seen="${esc(t.id)}" title="Mark the report seen: the task moves to Done here; the master folds it into tasks.js">Mark seen ✓</button>` : "")
        + (x.seenHere ? ` <span class="mut3" style="font-size:12.5px">seen here ${esc(seen[t.id])} · <a data-unseen="${esc(t.id)}">undo</a></span>` : "") : "";
    return `<div class="tdet" data-det="${esc(t.id)}">${strips}<div class="kv">`
      + kv("Status", status)
      + kv("Who", esc(who) + (whoSub ? `<small>${esc(whoSub)}</small>` : ""))
      + kv("Asked", esc([t.day, t.origin === "initial" ? "at the start of the work set" : t.origin === "added" ? "added later" : ""].filter(Boolean).join(" · ")))
      + kv("Evidence", t.evidence && t.evidence !== "-" ? esc(t.evidence) : "")
      + `</div>` + linesHtml(x) + readingRows(x) + `</div>`;
  }
  function tableHtml(list) {
    return `<div class="thead"><span>#</span><span>Task</span><span>Status · who</span><span>Reports, newest first</span></div>`
      + grouped(list).map(([g, xs]) => { const f = fold.has("g:" + g);
        return `<div class="card grp"><div class="tgh" data-group="${esc(g)}" data-fold="g:${esc(g)}"><span class="ch">${f ? "▸" : "▾"}</span>${esc(g || "No group")} <span class="cap">${xs.length} shown</span></div>${f ? "" : xs.map(rowHtml).join("")}</div>`; }).join("");
  }
  // the tasks of the chosen filter; Open also holds a done task while one of its asks is open
  const tasksList = M => filter === "open" ? M.tasks.filter(x => x.inOpen) : M.tasks.filter(M.by[filter] || M.by.open);
  // The Tasks tab holds the task table only: the sessions are in the sidebar, the filters in the sidebar and its rail.
  function renderTasks(D, M) {
    let h = "";
    const seenIds = Object.keys(seen).filter(id => M.tasks.some(x => x.t.id === id && x.seenHere)).sort((a, b) => num(a) - num(b));
    if (seenIds.length) {
      const line = "seen on the task page: " + seenIds.map(id => id + " (" + seen[id] + ")").join(", ");
      h += `<div class="seenbar"><span>Marked seen here, not yet in tasks.js: ${seenIds.map(esc).join(", ")}. Tell the master:</span><code id="seenline">${esc(line)}</code>`
        + `<button class="btn" data-copy="seenline">Copy</button><span id="copied" class="mut"></span></div>`;
    }
    const fl = M.filters.find(f => f[0] === filter) || M.filters[0];
    const list = tasksList(M), groups = grouped(list);

      if (d.mode === "collapse") { keys.forEach(k => fold.add(k)); ids.forEach(id => open.delete(id)); }
      else { keys.forEach(k => fold.delete(k)); ids.forEach(id => open.add(id)); }
      store.set("fold", [...fold]); store.set("open", [...open]); return render();
    }
    if (d.exp) { toggle(open, "open", d.exp); if (!open.has(d.exp)) { full.delete(d.exp); store.set("full", [...full]); } return render(); }
    if (d.full) { full.add(d.full); store.set("full", [...full]); return render(); }
    if (d.line) { toggle(lines, "lines", d.line); return render(); }
    if (d.seen) { seen[d.seen] = stamp(); store.set(SEEN_KEY, seen); return render(); }
    if (d.unseen) { delete seen[d.unseen]; store.set(SEEN_KEY, seen); return render(); }
    if (d.copy) {
      const text = document.getElementById(d.copy).textContent, out = document.getElementById("copied");
      return navigator.clipboard.writeText(text).then(() => { out.textContent = "copied"; }, err => { out.textContent = "copy failed (" + err.name + "): select the line and copy it"; });
    }
    if (el.matches("a.doc")) { e.preventDefault(); openPanel({ url: d.url, label: d.label, task: d.task || "" }); return render(); }
    if (el.id === "panelchip") { panelOpen = !panelIsOpen(); store.set("panelOpen", panelOpen); showPanel(); return render(); }
    if (el.id === "sideopen" || el.id === "sideclose") { store.set("side", el.id === "sideopen"); return render(); }
    if (el.id === "themecycle") { theme = { auto: "light", light: "dark", dark: "auto" }[theme]; store.set("theme", theme); return render(); }
    if (el.matches("#themeseg button")) { theme = d.theme; store.set("theme", theme); return render(); }
    if (el.id === "pclose") {                      // Grill me open: close it; a report open: back to the empty panel; the empty panel: hide it
      if (grill) { grill = null; store.set("grill", null); showPanel(); return render(); }
      if (panel) { panel = null; store.set("panel", null); } else { panelOpen = false; store.set("panelOpen", false); }
      showPanel(); return render();
    }
    if (el.id === "askchip") return goTab(window.DASH.asks && window.DASH.asks.some(a => a.state !== "answered") ? "questions" : "tasks");
    if (el.id === "readchip") return goFilter("pend");
  });
  // dragging the panel's left edge: the panel's right edge is the window's, so the width is the distance to it
  const grip = document.getElementById("pgrip");
  const edgeOffset = () => (document.body.classList.contains("narrow") ? 14 : 0);   // the panel's own padding when it lies over the list
  grip.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    e.preventDefault(); grip.setPointerCapture(e.pointerId); document.body.classList.add("dragging");
  });
  grip.addEventListener("pointermove", e => {
    if (!grip.hasPointerCapture(e.pointerId)) return;
    setPanelWidth(window.innerWidth - e.clientX + edgeOffset(), false);
  });
  const endDrag = e => {
    if (!document.body.classList.contains("dragging")) return;
    document.body.classList.remove("dragging");
    if (e && e.pointerId != null && grip.hasPointerCapture(e.pointerId)) grip.releasePointerCapture(e.pointerId);
    store.set("panelw", pw);
  };
  grip.addEventListener("pointerup", endDrag);
  grip.addEventListener("pointercancel", endDrag);
  // A drag that ends without a pointerup on the grip (capture lost, the button let go outside the window, the window losing
  // focus) must still end: otherwise body.dragging stays on and the page keeps the resize cursor and no text selection.
  grip.addEventListener("lostpointercapture", endDrag);
  window.addEventListener("blur", endDrag);
  window.addEventListener("pointerup", endDrag);
  document.addEventListener("pointermove", e => { if (document.body.classList.contains("dragging") && !(e.buttons & 1)) endDrag(e); });
  grip.addEventListener("dblclick", () => { pw = null; store.set("panelw", null); applyPanelWidth(); });
  grip.addEventListener("keydown", e => {
    const step = e.shiftKey ? 96 : 32, now = applyPanelWidth();
    if (e.key === "ArrowLeft") { e.preventDefault(); setPanelWidth(now + step, true); }
    else if (e.key === "ArrowRight") { e.preventDefault(); setPanelWidth(now - step, true); }
    else if (e.key === "Home" || e.key === "Enter") { e.preventDefault(); pw = null; store.set("panelw", null); applyPanelWidth(); }
  });
  // typing in a notes box keeps the draft (no redraw: the box keeps its focus), mirrors it into the same ask's other box and enables the buttons
  document.body.addEventListener("input", e => {
    const t = e.target; if (!t || !t.dataset || !t.dataset.notes) return;
    const id = t.dataset.notes, s = dset(id);
    s.notes = String(t.value).slice(0, NOTES_MAX); if (s.state === "copied" || s.state === "copyfail" || s.state === "senderr") s.state = ""; saveAns();
    const has = !!(s.choice || s.notes.trim());
    document.querySelectorAll(`[data-notes="${id}"]`).forEach(o => { if (o !== t) o.value = s.notes; });
    document.querySelectorAll(`[data-copyans="${id}"],[data-sendans="${id}"]`).forEach(b => { b.disabled = !has || (b.dataset.sendans && !canSend()); });
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && menuTask) closeMenu(); });
  window.addEventListener("resize", () => applyLayout());
  document.getElementById("scroller").addEventListener("scroll", e => e.target.classList.toggle("pinned", e.target.scrollTop > 0));

  // Data refresh without a page reload: load tasks.js again every 90 s; the tab, the panel and the expanded rows stay.
  function loadData(first) {
    const s = document.createElement("script");
    s.src = "tasks.js?t=" + Date.now();
    s.onload = () => { if (!typing()) render(); if (first) showPanel(); s.remove(); };      // never redraw under a notes box being typed in
    s.onerror = () => { s.remove(); document.getElementById("waiting").innerHTML = "<b>tasks.js did not load</b> (" + esc(new Date().toTimeString().slice(0, 5)) + "): the page shows the last data it read."; };
    document.body.appendChild(s);
  }
  loadData(true);
  setInterval(() => loadData(false), 90000);
  // the channel: the link state every 10 s; a sent answer waits for its ack (3 s) and, while one has no answer from the master yet,
  // tasks.js is read every 5 s instead of 90 s, so a grill-me run's next question shows quickly
  pollLink(); setInterval(pollLink, 10000); setInterval(pollAcks, 3000);
  setInterval(() => { if (SERVED && Object.values(ans).some(d => d.state === "sent")) loadData(false); }, 5000);
</script>
