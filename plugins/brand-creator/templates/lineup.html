<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{name}} marks</title>
<!-- brand-creator side-by-side template: every mark of a project with several marks (qa/rules.json marks), each with its drawn wordmark
     or its name under it, and the brand's own lettering or name above them. Filled by scripts/emitters/social.py (emit social without
     --mark) and rendered to PNG by render.mjs card, the only Chromium driver. Every value is HTML-escaped except the title and the row of
     marks, which the emitter builds itself (images of the drawings, so their ids cannot clash). Sizes in px are worked out from the card's
     size, and pixel art is set at a whole-number scale. {{rule_radius}} is the accent line's corner radius: its height in px (round ends), or
     0 (square ends) when every mark is pixel art. Self-contained: no network, no web fonts (system stack). Copy it and pass it
     with --template to restyle; keep every placeholder. -->
<style>
html,body{margin:0;width:{{width}}px;height:{{height}}px;overflow:hidden;background:{{bg}};color:{{fg}}}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:{{gap}}px;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.head{display:flex;flex-direction:column;align-items:center}
h1{margin:0;font-size:{{title_px}}px;line-height:1.05;letter-spacing:-0.02em;font-weight:700}
.lettering{display:block}
.rule{width:{{rule_w}}px;height:{{rule_h}}px;background:{{accent}};margin-top:{{rule_h}}px;border-radius:{{rule_radius}}}
.row{display:flex;gap:{{gap_x}}px;align-items:flex-start;justify-content:center}
figure{margin:0;width:{{cell_w}}px;display:flex;flex-direction:column;align-items:center;gap:{{caption_gap}}px}
.m{display:block}
figcaption{display:flex;align-items:center;justify-content:center;height:{{caption_h}}px;font-size:{{caption_px}}px;line-height:1;font-weight:600}
p{margin:0;font-size:{{sub_px}}px;line-height:1.3;color:{{muted}}}
p:empty{display:none}
</style>
</head>
<body>
<div class="head">{{lettering}}<div class="rule"></div></div>
<div class="row">{{marks}}</div>
<p>{{tagline}}</p>
</body>
</html>
