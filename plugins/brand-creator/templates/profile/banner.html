<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{name}} profile banner</title>
<!-- brand-creator profile banner template (LinkedIn, X, YouTube, Facebook banners and the Instagram feed and story images). Filled by
     scripts/emitters/profiles.py and rendered to PNG by render.mjs card, the only Chromium driver. Values are HTML-escaped except {{mark}} (the raw SVG)
     and {{proof}} (the safe-area overlay: empty in the shipped image, filled in the proof image next to it).
       {{width}} {{height}}                      the platform's image size (platform-specs.json)
       {{safe_x}} {{safe_y}} {{safe_w}} {{safe_h}}  the safe rectangle in px: everything that is drawn stays inside it, and the emitter fails when ink lands outside
       {{direction}} {{align}} {{items}} {{gap}}   row or column layout of the mark and the name, the text alignment and the alignment of the name block, the gap in px
       {{mark_px}} {{title_px}} {{sub_px}} {{rule_w}} {{rule_h}}   sizes in px worked out from the safe rectangle
       {{bg}} {{fg}} {{muted}} {{accent}}         colours from the built tokens (color.bg, color.text, color.muted, color.accent)
       {{name}} {{tagline}} {{mark}} {{proof}}
     Self-contained: no network, no web fonts (system stack). Copy it and pass it with --template to restyle; keep the placeholders. -->
<style>
html,body{margin:0;width:{{width}}px;height:{{height}}px;overflow:hidden;background:{{bg}};color:{{fg}}}
body{position:relative;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.safe{position:absolute;left:{{safe_x}}px;top:{{safe_y}}px;width:{{safe_w}}px;height:{{safe_h}}px;box-sizing:border-box;
  display:flex;flex-direction:{{direction}};align-items:center;justify-content:center;gap:{{gap}}px;text-align:{{align}}}
.mark{flex:none;width:{{mark_px}}px;height:{{mark_px}}px}
.mark svg{width:100%;height:100%;display:block}
.text{min-width:0;display:flex;flex-direction:column;align-items:{{items}}}
h1{margin:0;font-size:{{title_px}}px;line-height:1.05;letter-spacing:-0.02em;font-weight:700}
.rule{width:{{rule_w}}px;height:{{rule_h}}px;background:{{accent}};margin-top:{{rule_h}}px;border-radius:{{rule_h}}px}
p{margin:{{rule_h}}px 0 0;font-size:{{sub_px}}px;line-height:1.3;color:{{muted}}}
</style>
</head>
<body>
<div class="safe"><div class="mark">{{mark}}</div><div class="text"><h1>{{name}}</h1><div class="rule"></div><p>{{tagline}}</p></div></div>
{{proof}}
</body>
</html>
