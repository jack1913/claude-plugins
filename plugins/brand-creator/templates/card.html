<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{name}} card</title>
<!-- brand-creator card template (minimal). Rendered to PNG by `brand-creator card` / `emit social`.
     Placeholders, all filled by scripts/emitters/social.py (values are HTML-escaped; {{mark}} is the raw SVG, {{lettering}} HTML):
       {{width}} {{height}}  pixel size from platform-specs.json
       {{bg}} {{fg}} {{muted}} {{accent}}  colours from the built tokens (color.bg, color.text, color.muted, color.accent)
       {{layout}}  lockup (the drawn lockup stands alone, {{mark}} is empty), wordmark (the drawn name next to the mark) or type (the name as
                   live text in the system font: no lockup or wordmark, or --name given)
       {{lettering}}  the drawn lockup or wordmark as an image of class "lettering" sized to fit, or the name as an h1 heading for type
       {{name}} {{tagline}} {{mark}}
     Self-contained: no network, no web fonts (system stack). A richer template may replace this one if it keeps the same
     placeholders. A template without {{lettering}} (written before 0.3.1) gets the name as text, and the report warns. -->
<style>
html,body{margin:0;width:{{width}}px;height:{{height}}px;overflow:hidden;background:{{bg}};color:{{fg}}}
body{display:flex;align-items:center;gap:6vh;padding:0 9vw;box-sizing:border-box;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.mark{flex:none;height:58vh;aspect-ratio:1}
.mark svg{width:100%;height:100%;display:block}
.lockup .mark{display:none}
.lettering{display:block;margin-bottom:3vh}   /* the space live text keeps under its baseline: 0.2 of the 15vh name */
.text{min-width:0}
h1{margin:0;font-size:15vh;line-height:1.05;letter-spacing:-0.02em;font-weight:700}
p{margin:2vh 0 0;font-size:6vh;line-height:1.3;color:{{muted}}}
.rule{width:12vh;height:1vh;background:{{accent}};margin-top:3vh;border-radius:1vh}
</style>
</head>
<body class="{{layout}}">
<div class="mark">{{mark}}</div>
<div class="text">{{lettering}}<div class="rule"></div><p>{{tagline}}</p></div>
</body>
</html>
