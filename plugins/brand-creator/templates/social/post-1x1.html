<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<title>{{name}} square 1:1 post</title>
<!-- brand-creator social post template (square 1:1 post). Filled by scripts/emitters/social.py --posts and rendered to PNG by render.mjs card, the only
     Chromium driver. Values are HTML-escaped except the blocks the emitter builds (mark art, point list, regulated attribute). Every word on
     the post is the value (or the label) of a FACTS.md row: the emitter takes no other copy. For a regulated profession (the brief says so)
     the body carries data-regulated-checklist, the posts folder gets PRE-PUBLICATION.md, and nothing is published before the owner ticks it.
     Self-contained: no network, no web fonts. Copy the folder and pass it with --post-template-dir to restyle. -->
<style>
html,body{margin:0;width:{{width}}px;height:{{height}}px;overflow:hidden}
body{--u:calc({{width}}px / 100);position:relative;box-sizing:border-box;padding:calc(var(--u) * 9);background:{{bg}};color:{{fg}};
  display:flex;flex-direction:column;justify-content:space-between;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center}
.mark{height:calc(var(--u) * 7);aspect-ratio:1}
.mark svg{width:100%;height:100%;display:block}
.counter{font-size:calc(var(--u) * 2.8);color:{{muted}};letter-spacing:.06em}
.kicker{font-size:calc(var(--u) * 3.1);letter-spacing:.08em;text-transform:uppercase;color:{{muted}};margin:0 0 calc(var(--u) * 2.5)}
.rule{width:calc(var(--u) * 12);height:calc(var(--u) * 1);background:{{accent}};margin-bottom:calc(var(--u) * 3.5);border-radius:calc(var(--u) * 1)}
h1{margin:0;font-size:calc(var(--u) * 6.4);line-height:1.14;font-weight:700;letter-spacing:-0.015em}
.foot{font-size:calc(var(--u) * 3);color:{{muted}}}
li{list-style:none}
ol{margin:0;padding:0;display:flex;flex-direction:column;gap:calc(var(--u) * 4.5)}
ol li{display:flex;gap:calc(var(--u) * 4);align-items:flex-start}
.n{flex:none;width:calc(var(--u) * 8);height:calc(var(--u) * 8);border-radius:50%;background:{{accent}};color:{{bg}};font-weight:700;
  font-size:calc(var(--u) * 4);display:flex;align-items:center;justify-content:center}
.lab{font-size:calc(var(--u) * 2.8);letter-spacing:.08em;text-transform:uppercase;color:{{muted}}}
.val{font-size:calc(var(--u) * 4.6);line-height:1.25;font-weight:600}
</style>
</head>
<body{{regulated_attr}}>
<div class="top"><div class="mark">{{mark}}</div><div class="counter">{{counter}}</div></div>
<main><p class="kicker">{{kicker}}</p><div class="rule"></div><h1>{{headline}}</h1></main>
<div class="foot">{{name}}</div>
</body>
</html>
