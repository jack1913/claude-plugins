<!-- generated by brand-creator: the logo in light and dark, switched as tokens.css switches them; paths are relative to this file -->
<!-- in a product: copy brand/assets/logo/ into the product's own public or static folder and point each image below at the path the site serves it from; a built site does not serve .claude/skills/ -->
<style>
  /* light shows by default; dark shows where tokens.css switches to dark; only display: none is used, so the page keeps the display value it chose */
  :root[data-theme="light"] .brand-logo--dark { display: none; }
  :root[data-theme="dark"] .brand-logo--light { display: none; }
  @media not all and (prefers-color-scheme: dark) {
    :root:not([data-theme="dark"]) .brand-logo--dark { display: none; }
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .brand-logo--light { display: none; }
  }
</style>

<!-- grid-mark -->
<img class="brand-logo brand-logo--light" src="../brand/assets/logo/grid-mark.svg" alt="Acme">
<img class="brand-logo brand-logo--dark" src="../brand/assets/logo/grid-mark-dark.svg" alt="Acme">

<!-- mark -->
<img class="brand-logo brand-logo--light" src="../brand/assets/logo/mark.svg" alt="Acme">
<img class="brand-logo brand-logo--dark" src="../brand/assets/logo/mark-dark.svg" alt="Acme">

<!-- mark-animated -->
<img class="brand-logo" src="../brand/assets/logo/mark-animated.svg" alt="Acme">

<!-- wordmark -->
<img class="brand-logo brand-logo--light" src="../brand/assets/logo/wordmark.svg" alt="Acme">
<img class="brand-logo brand-logo--dark" src="../brand/assets/logo/wordmark-dark.svg" alt="Acme">
